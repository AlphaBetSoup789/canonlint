name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with repo scope on the signatures repository. Until this
          # secret is set, the job is a no-op rather than a red X on every PR.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/AlphaBetSoup789/canonlint/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'AlphaBetSoup789,dependabot[bot]'
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please sign
            the [Contributor License Agreement](https://github.com/AlphaBetSoup789/canonlint/blob/main/CLA.md)
            by posting the comment below. You keep your copyright — see the CLA
            for why this is required.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
